name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "TripleGeminiBrowser/**"
      - "TripleGeminiBrowser.xcodeproj/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build_trollstore_ipa.sh
          ./scripts/build_trollstore_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TripleGeminiBrowser-trollstore
          path: build/TripleGeminiBrowser-trollstore.ipa
          if-no-files-found: error
          retention-days: 14
